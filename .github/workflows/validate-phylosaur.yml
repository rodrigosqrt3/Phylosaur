name: Validate Phylosaur

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run project integrity tests
        run: |
          cp tests/release_integrity_test.txt /tmp/release_integrity_test.ts
          deno test --allow-read /tmp/release_integrity_test.ts
