<body>
  <script>

  <div class="container" id="main-container">

        <div class="header-theme-row">

            <select id="language-select" data-localization-ignore onchange="changeLanguage(this.value)"
                    aria-label="Language">
              <option value="de">Deutsch</option>
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
              <option value="ja">日本語</option>
              <option value="pt-BR">Português</option>
            </select>
          </label>
          <button class="theme-switch header-theme-switch" onclick="toggleTheme()" id="theme-toggle"
                  type="button" aria-label="Switch to light mode" aria-pressed="false">

            </span>
          </button>
        </div>
        <div id="header-controls"></div>
      </div>
    </div>
  </header>
    <div id="app-content">
      <div class="game-card">
        <div class="app-state app-state-loading" role="status" aria-live="polite">
          <span class="app-state-icon" aria-hidden="true"></span>
          <div class="app-state-message" data-i18n="app.preparing">Preparing Phylosaur…</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var messages = {
        en: ['Phylosaur could not finish loading. Check your connection and try again.', 'Reload'],
        'pt-BR': ['Não foi possível terminar de carregar o Phylosaur. Verifique sua conexão e tente novamente.', 'Recarregar'],
        es: ['No se pudo terminar de cargar Phylosaur. Revisa tu conexión e inténtalo de nuevo.', 'Recargar'],
        fr: ['Phylosaur n’a pas pu finir de se charger. Vérifiez votre connexion et réessayez.', 'Recharger'],
        de: ['Phylosaur konnte nicht vollständig geladen werden. Prüfe deine Verbindung und versuche es erneut.', 'Neu laden'],
        ja: ['Phylosaurを読み込めませんでした。接続を確認して、もう一度お試しください。', '再読み込み']
      };
      function pickLocale() {
        var wanted = '';
        try { wanted = new URLSearchParams(location.search).get('lang') || localStorage.getItem('phylosaur-language') || ''; } catch (_error) {}
        var candidates = [wanted].concat(navigator.languages || [navigator.language || '']);
        for (var i = 0; i < candidates.length; i++) {
          var code = String(candidates[i] || '');
          if (/^pt/i.test(code)) return 'pt-BR';
          var base = code.slice(0, 2).toLowerCase();
          if (messages[base]) return base;
        }
        return 'en';
      }
      window.showPhylosaurBootError = function () {
        if (window.phylosaurBooted) return;
        var content = document.getElementById('app-content');
        if (!content) return;
        var text = messages[pickLocale()];
        content.innerHTML = '<div class="game-card"><div class="app-state app-state-error" role="alert">'
          + '<span class="app-state-icon" aria-hidden="true"></span>'
          + '<div class="app-state-message"></div>'
          + '<button type="button" class="btn-new-game app-state-action"></button></div></div>';
        content.querySelector('.app-state-message').textContent = text[0];
        var button = content.querySelector('.app-state-action');
        button.textContent = text[1];
        button.addEventListener('click', function () { location.reload(); });
      };
      setTimeout(window.showPhylosaurBootError, 20000);
    })();

    if ('serviceWorker' in navigator) {
      var hadServiceWorker = Boolean(navigator.serviceWorker.controller);
      var lastUpdateCheck = Date.now();
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then(registration => {
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState !== 'visible' || Date.now() - lastUpdateCheck < 3600000) return;
              lastUpdateCheck = Date.now();
              registration.update().catch(() => {});
            });
          })
          .catch(error => console.warn('Phylosaur service worker was not registered:', error));
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadServiceWorker || document.querySelector('.update-toast') || typeof t !== 'function') return;
        var toast = document.createElement('div');
        toast.className = 'update-toast';
        toast.setAttribute('role', 'status');
        var copy = document.createElement('span');
        copy.textContent = t('app.updateReady');
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn-hint';
        button.textContent = t('app.reload');
        button.addEventListener('click', () => location.reload());
        toast.append(copy, button);
        document.body.appendChild(toast);
      });
    }
  </script>
