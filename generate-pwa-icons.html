<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phylosaur PWA Icon Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8f6f3;
      background: #1f1812;
      font-family: Georgia, serif;
      text-align: center;
    }
    main {
      width: min(620px, 100%);
      padding: 32px;
      background: #2c2318;
      border: 2px solid #4a3829;
      border-radius: 8px;
    }
    svg { width: 180px; height: 180px; border-radius: 50%; }
    h1 { color: #d4b87e; }
    p { color: #a68a5a; line-height: 1.6; }
    .buttons { display: grid; gap: 10px; margin-top: 24px; }
    button {
      min-height: 48px;
      padding: 12px 18px;
      color: #1a1410;
      background: #c9a96e;
      border: 2px solid #8b7355;
      border-radius: 4px;
      font: 600 14px Georgia, serif;
      cursor: pointer;
    }
    #status { min-height: 24px; margin-top: 18px; color: #c8e6c9; }
  </style>
</head>
<body>
  <main>
    <svg id="source-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Phylosaur</title>
  <desc id="desc">A theropod footprint pressed into a dark circular seal, with a gold rim and a shadowed interior.</desc>
  <defs>
    <path id="footprint" d="M511.517 370.284c-5.971-20.294-92.954-22.906-113.159-18.866-20.216 4.041-76.79 2.68-88.913-9.443-12.124-12.124 4.041-32.329 16.175-44.451 12.124-12.124 38.389-50.524 46.472-58.606 8.082-8.082 50.166-50.378 65.325-74.758 30.988-49.843 41.437-98.68 25.262-114.845-16.164-16.164-65.003-5.727-114.834 25.262-24.38 15.17-66.688 57.244-74.769 65.325-8.083 8.083-46.472 34.36-58.606 46.483-12.122 12.124-32.328 28.287-44.451 16.164-12.122-12.124-13.474-68.698-9.433-88.902 4.041-20.205 1.419-107.187-18.866-113.16C121.438-5.483 83.798 44.94 68.984 87.37c-8.685 24.871-82.852 141.446-66.688 226.319 16.175 84.872 31 127.982 49.507 146.503 18.519 18.519 61.642 33.343 146.503 49.507 84.872 16.164 201.448-57.991 226.319-66.676 42.431-14.825 92.853-52.466 86.892-72.739z"/>
    <clipPath id="footprint-clip"><use href="#footprint"/></clipPath>
    <linearGradient id="imprint-rim" x1="15%" y1="8%" x2="88%" y2="92%">
      <stop offset="0" stop-color="#ecd49a"/>
      <stop offset="0.34" stop-color="#b8955a"/>
      <stop offset="0.7" stop-color="#6a4f2c"/>
      <stop offset="1" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="imprint-floor" x1="12%" y1="6%" x2="86%" y2="94%">
      <stop offset="0" stop-color="#0d0906"/>
      <stop offset="0.45" stop-color="#22180f"/>
      <stop offset="1" stop-color="#4a3620"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="cast" x="-18%" y="-18%" width="145%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset in="b" dx="3" dy="9" result="o"/>
      <feFlood flood-color="#050302" flood-opacity="0.85"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>
  <circle cx="256" cy="256" r="246" fill="#1f1812"/>
  <circle cx="256" cy="256" r="218" fill="#2d2318" stroke="#4a3829" stroke-width="10"/>
  <g transform="translate(76 76) scale(.703125)">
    <use href="#footprint" fill="#0a0705" filter="url(#cast)"/>
    <use href="#footprint" fill="url(#imprint-floor)"/>
    <g clip-path="url(#footprint-clip)">
      <use href="#footprint" fill="none" stroke="#000" stroke-opacity="0.85" stroke-width="70" transform="translate(16 22)" filter="url(#soft)"/>
      <use href="#footprint" fill="none" stroke="#d9b876" stroke-opacity="0.55" stroke-width="16" transform="translate(-10 -13)" filter="url(#softer)"/>
    </g>
    <use href="#footprint" fill="none" stroke="url(#imprint-rim)" stroke-width="20" stroke-linejoin="round"/>
    <use href="#footprint" fill="none" stroke="#fff3d2" stroke-opacity="0.75" stroke-width="4" stroke-linejoin="round" transform="translate(-3 -4)"/>
  </g>
</svg>

    <h1>Phylosaur PWA Icons</h1>
    <p>Click each button and keep the downloaded file name unchanged.</p>

    <div class="buttons">
      <button type="button" onclick="downloadIcon(192, 'pwa-icon-192.png')">Download pwa-icon-192.png</button>
      <button type="button" onclick="downloadIcon(512, 'pwa-icon-512.png')">Download pwa-icon-512.png</button>
      <button type="button" onclick="downloadIcon(180, 'apple-touch-icon.png')">Download apple-touch-icon.png</button>
    </div>

    <div id="status" aria-live="polite"></div>
  </main>

  <script>
    async function downloadIcon(size, fileName) {
      const source = document.getElementById('source-icon');
      const serialized = new XMLSerializer().serializeToString(source);
      const blob = new Blob([serialized], { type: 'image/svg+xml;charset=utf-8' });
      const sourceUrl = URL.createObjectURL(blob);
      const image = new Image();

      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = reject;
        image.src = sourceUrl;
      });

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      context.drawImage(image, 0, 0, size, size);
      URL.revokeObjectURL(sourceUrl);

      const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      const downloadUrl = URL.createObjectURL(pngBlob);
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);

      document.getElementById('status').textContent = `${fileName} created successfully.`;
    }
  </script>
</body>
</html>
