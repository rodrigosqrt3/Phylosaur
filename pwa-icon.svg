<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Phylosaur — experimental debossed footprint</title>
  <desc id="desc">An experimental version of the original Phylosaur footprint, pressed into the same dark circular seal.</desc>
  <defs>
    <linearGradient id="imprint-fill" x1="18%" y1="8%" x2="82%" y2="94%">
      <stop offset="0" stop-color="#3b2d1e"/>
      <stop offset="0.48" stop-color="#211910"/>
      <stop offset="1" stop-color="#120e0a"/>
    </linearGradient>
    <linearGradient id="imprint-rim" x1="15%" y1="8%" x2="88%" y2="92%">
      <stop offset="0" stop-color="#e0c98f"/>
      <stop offset="0.34" stop-color="#a88954"/>
      <stop offset="0.7" stop-color="#574126"/>
      <stop offset="1" stop-color="#332517"/>
    </linearGradient>
    <filter id="imprint-shadow" x="-18%" y="-18%" width="145%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="2" dy="8" result="offset-blur"/>
      <feFlood flood-color="#0a0705" flood-opacity="0.9" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="footprint" d="M511.517 370.284c-5.971-20.294-92.954-22.906-113.159-18.866-20.216 4.041-76.79 2.68-88.913-9.443-12.124-12.124 4.041-32.329 16.175-44.451 12.124-12.124 38.389-50.524 46.472-58.606 8.082-8.082 50.166-50.378 65.325-74.758 30.988-49.843 41.437-98.68 25.262-114.845-16.164-16.164-65.003-5.727-114.834 25.262-24.38 15.17-66.688 57.244-74.769 65.325-8.083 8.083-46.472 34.36-58.606 46.483-12.122 12.124-32.328 28.287-44.451 16.164-12.122-12.124-13.474-68.698-9.433-88.902 4.041-20.205 1.419-107.187-18.866-113.16C121.438-5.483 83.798 44.94 68.984 87.37c-8.685 24.871-82.852 141.446-66.688 226.319 16.175 84.872 31 127.982 49.507 146.503 18.519 18.519 61.642 33.343 146.503 49.507 84.872 16.164 201.448-57.991 226.319-66.676 42.431-14.825 92.853-52.466 86.892-72.739z"/>
  </defs>

  <!-- The original circular seal is retained unchanged. -->
  <circle cx="256" cy="256" r="246" fill="#1f1812"/>
  <circle cx="256" cy="256" r="218" fill="#2d2318" stroke="#4a3829" stroke-width="10"/>

  <!-- A soft cast shadow makes the mark sit below the surrounding surface. -->
  <g transform="translate(76 76) scale(.703125)">
    <use href="#footprint" fill="#120d08" transform="translate(1 3)" filter="url(#imprint-shadow)"/>
    <!-- Dark bevel wall on the lower/right edge. -->
    <use href="#footprint" fill="none" stroke="#17110b" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(4 7)"/>
    <!-- Depressed surface and subdued rim, instead of the original flat gold outline. -->
    <use href="#footprint" fill="url(#imprint-fill)" stroke="url(#imprint-rim)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fine inner occlusion gives the edge a carved, ground-in quality. -->
    <use href="#footprint" fill="none" stroke="#1b140d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 2)" opacity="0.9"/>
    <!-- Restrained light on the upper/left lip. -->
    <use href="#footprint" fill="none" stroke="#e0c98f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -3)" opacity="0.68"/>
  </g>
</svg>
