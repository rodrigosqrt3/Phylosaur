<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d2318">
  <title>Phylosaur - Offline</title>
  <script>
    // Same pre-paint theme choice as the game, so the offline page matches the mode in use.
    try { if (localStorage.getItem('phylosaur-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (_error) {}
  </script>
  <style>
    :root {
      --bg: #2d2318; --card-top: #2c2318; --card-bottom: #221a12; --border: #4a3829;
      --title: #d4b87e; --copy: #a68a5a; --button-bg: linear-gradient(180deg, #dcc58f 0%, #bd9a60 100%);
      --button-border: #a88752; --button-color: #1a1410; --glow: rgba(244, 228, 193, 0.08);
      --shadow: 0 18px 50px rgba(0, 0, 0, .45);
    }
    :root[data-theme="light"] {
      --bg: #e8dcc8; --card-top: #f5f0e8; --card-bottom: #e8dcc8; --border: #c9a96e;
      --title: #4a3829; --copy: #5c4033; --button-bg: linear-gradient(180deg, #966744 0%, #754a2f 100%);
      --button-border: #684128; --button-color: #ffffff; --glow: rgba(255, 255, 255, 0.5);
      --shadow: 0 18px 40px rgba(62, 48, 31, .22);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--title);
      background: var(--bg);
      /* The game's display face; offline it falls back to Georgia if it was not cached. */
      font-family: 'Playfair Display', Georgia, serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(520px, 100%);
      padding: 40px 30px;
      background: radial-gradient(120% 90% at 50% -30%, var(--glow) 0%, transparent 60%),
        linear-gradient(180deg, var(--card-top), var(--card-bottom));
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 var(--glow), var(--shadow);
    }
    img { width: 112px; height: 112px; border-radius: 26px; }
    h1 { margin: 22px 0 12px; color: var(--title); font-size: clamp(1.5rem, 6vw, 1.9rem); font-weight: 900; }
    p { margin: 0 0 26px; color: var(--copy); line-height: 1.7; }
    button {
      min-height: 46px;
      padding: 12px 26px;
      color: var(--button-color);
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 999px;
      font: 700 13px 'Playfair Display', Georgia, serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 4px 12px rgba(0, 0, 0, .25);
    }
    button:focus-visible { outline: 3px solid var(--title); outline-offset: 3px; }
  </style>
</head><body>
  <main>
    <img src="pwa-icon-192.png" alt="Phylosaur footprint" id="offline-logo">
    <h1 id="offline-title">The trail went offline</h1>
    <p id="offline-copy">Phylosaur needs an internet connection to create and validate challenges. Reconnect and try again.</p>
    <button id="offline-retry" type="button" onclick="window.location.reload()">Try again</button>
  </main>
  <script>
    const offlineMessages = {
      en: {
        metaTitle: 'Phylosaur - Offline',
        title: 'The trail went offline',
        copy: 'Phylosaur needs an internet connection to create and validate challenges. Reconnect and try again.',
        retry: 'Try again', alt: 'Phylosaur footprint'
      },
      'pt-BR': {
        metaTitle: 'Phylosaur - Sem conexão',
        title: 'A trilha ficou sem conexão',
        copy: 'O Phylosaur precisa de conexão com a internet para criar e validar desafios. Reconecte-se e tente novamente.',
        retry: 'Tentar novamente', alt: 'Pegada do Phylosaur'
      },
      es: {
        metaTitle: 'Phylosaur - Sin conexión',
        title: 'El camino quedó sin conexión',
        copy: 'Phylosaur necesita conexión a internet para crear y validar desafíos. Vuelve a conectarte e inténtalo de nuevo.',
        retry: 'Intentar de nuevo', alt: 'Huella de Phylosaur'
      },
      de: {
        metaTitle: 'Phylosaur - Offline',
        title: 'Der Pfad ist offline',
        copy: 'Phylosaur benötigt eine Internetverbindung, um Herausforderungen zu erstellen und zu überprüfen. Stelle die Verbindung wieder her und versuche es erneut.',
        retry: 'Erneut versuchen', alt: 'Phylosaur-Fußabdruck'
      },
      fr: {
        metaTitle: 'Phylosaur - Hors ligne',
        title: 'La piste est hors ligne',
        copy: 'Phylosaur a besoin d’une connexion Internet pour créer et valider les défis. Reconnectez-vous et réessayez.',
        retry: 'Réessayer', alt: 'Empreinte de Phylosaur'
      },
      ja: {
        metaTitle: 'Phylosaur - オフライン',
        title: 'オフラインになりました',
        copy: 'Phylosaurでチャレンジを作成・検証するにはインターネット接続が必要です。接続を確認して、もう一度お試しください。',
        retry: '再試行', alt: 'Phylosaurの足跡'
      }
    };
    let storedLanguage = null;
    try { storedLanguage = localStorage.getItem('phylosaur-language'); } catch (_error) {}
    const browserLanguage = storedLanguage || navigator.language || 'en';
    const locale = browserLanguage.toLowerCase().startsWith('pt')
      ? 'pt-BR' : browserLanguage.toLowerCase().startsWith('es') ? 'es'
        : browserLanguage.toLowerCase().startsWith('de') ? 'de'
          : browserLanguage.toLowerCase().startsWith('fr') ? 'fr'
            : browserLanguage.toLowerCase().startsWith('ja') ? 'ja' : 'en';
    const message = offlineMessages[locale];
    document.documentElement.lang = locale;
    document.title = message.metaTitle;
    document.getElementById('offline-title').textContent = message.title;
    document.getElementById('offline-copy').textContent = message.copy;
    document.getElementById('offline-retry').textContent = message.retry;
    document.getElementById('offline-logo').alt = message.alt;
  </script>
</body>
</html>
