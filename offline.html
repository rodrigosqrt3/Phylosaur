<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d2318">
  <title>Phylosaur - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8f6f3;
      background: #1f1812;
      font-family: Georgia, serif;
      text-align: center;
    }
    main {
      width: min(520px, 100%);
      padding: 38px 28px;
      background: #2c2318;
      border: 2px solid #4a3829;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    }
    img { width: 112px; height: 112px; border-radius: 24px; }
    h1 { margin: 22px 0 12px; color: #d4b87e; }
    p { margin: 0 0 26px; color: #a68a5a; line-height: 1.7; }
    button {
      min-height: 48px;
      padding: 12px 24px;
      color: #1a1410;
      background: #c9a96e;
      border: 2px solid #8b7355;
      border-radius: 4px;
      font: 600 14px Georgia, serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="pwa-icon-192.png" alt="Phylosaur footprint" id="offline-logo">
    <h1 id="offline-title">The trail went offline</h1>
    <p id="offline-copy">Phylosaur needs an internet connection to create and validate challenges. Reconnect and try again.</p>
    <button id="offline-retry" type="button" onclick="window.location.reload()">Try again</button>
  </main>
  <script>
    const offlineMessages = {
      en: {
        metaTitle: 'Phylosaur - Offline',
        title: 'The trail went offline',
        copy: 'Phylosaur needs an internet connection to create and validate challenges. Reconnect and try again.',
        retry: 'Try again', alt: 'Phylosaur footprint'
      },
      'pt-BR': {
        metaTitle: 'Phylosaur - Sem conexão',
        title: 'A trilha ficou sem conexão',
        copy: 'O Phylosaur precisa de conexão com a internet para criar e validar desafios. Reconecte-se e tente novamente.',
        retry: 'Tentar novamente', alt: 'Pegada do Phylosaur'
      },
      es: {
        metaTitle: 'Phylosaur - Sin conexión',
        title: 'El camino quedó sin conexión',
        copy: 'Phylosaur necesita conexión a internet para crear y validar desafíos. Vuelve a conectarte e inténtalo de nuevo.',
        retry: 'Intentar de nuevo', alt: 'Huella de Phylosaur'
      }
    };
    const storedLanguage = localStorage.getItem('phylosaur-language');
    const browserLanguage = storedLanguage || navigator.language || 'en';
    const locale = browserLanguage.toLowerCase().startsWith('pt')
      ? 'pt-BR' : browserLanguage.toLowerCase().startsWith('es') ? 'es' : 'en';
    const message = offlineMessages[locale];
    document.documentElement.lang = locale;
    document.title = message.metaTitle;
    document.getElementById('offline-title').textContent = message.title;
    document.getElementById('offline-copy').textContent = message.copy;
    document.getElementById('offline-retry').textContent = message.retry;
    document.getElementById('offline-logo').alt = message.alt;
  </script>
</body>
</html>
