<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="app-title app-desc">
  <title id="app-title">Phylosaur</title>
  <desc id="app-desc">A theropod footprint pressed into dark earth, filling a square app icon without a surrounding frame.</desc>
  <defs>
    <path id="app-footprint" d="M511.517 370.284c-5.971-20.294-92.954-22.906-113.159-18.866-20.216 4.041-76.79 2.68-88.913-9.443-12.124-12.124 4.041-32.329 16.175-44.451 12.124-12.124 38.389-50.524 46.472-58.606 8.082-8.082 50.166-50.378 65.325-74.758 30.988-49.843 41.437-98.68 25.262-114.845-16.164-16.164-65.003-5.727-114.834 25.262-24.38 15.170-66.688 57.244-74.769 65.325-8.083 8.083-46.472 34.360-58.606 46.483-12.122 12.124-32.328 28.287-44.451 16.164-12.122-12.124-13.474-68.698-9.433-88.902 4.041-20.205 1.419-107.187-18.866-113.160C121.438-5.483 83.798 44.940 68.984 87.370c-8.685 24.871-82.852 141.446-66.688 226.319 16.175 84.872 31 127.982 49.507 146.503 18.519 18.519 61.642 33.343 146.503 49.507 84.872 16.164 201.448-57.991 226.319-66.676 42.431-14.825 92.853-52.466 86.892-72.739z"/>
    <clipPath id="app-footprint-clip"><use href="#app-footprint"/></clipPath>
    <radialGradient id="app-ground" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#362a1c"/>
      <stop offset="1" stop-color="#1c150f"/>
    </radialGradient>
    <linearGradient id="app-rim" x1="15%" y1="8%" x2="88%" y2="92%">
      <stop offset="0" stop-color="#ecd49a"/>
      <stop offset="0.34" stop-color="#b8955a"/>
      <stop offset="0.7" stop-color="#6a4f2c"/>
      <stop offset="1" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="app-floor" x1="12%" y1="6%" x2="86%" y2="94%">
      <stop offset="0" stop-color="#0d0906"/>
      <stop offset="0.45" stop-color="#22180f"/>
      <stop offset="1" stop-color="#4a3620"/>
    </linearGradient>
    <filter id="app-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="app-softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="app-cast" x="-18%" y="-18%" width="145%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset in="b" dx="3" dy="9" result="o"/>
      <feFlood flood-color="#050302" flood-opacity="0.85"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Full-bleed: the OS applies its own rounded mask, so there is no seal ring here.
       The footprint stays inside the 80% maskable safe zone. -->
  <rect width="512" height="512" fill="url(#app-ground)"/>
  <g transform="translate(92 92) scale(.64)">
    <use href="#app-footprint" fill="#0a0705" filter="url(#app-cast)"/>
    <use href="#app-footprint" fill="url(#app-floor)"/>
    <g clip-path="url(#app-footprint-clip)">
      <use href="#app-footprint" fill="none" stroke="#000" stroke-opacity="0.85" stroke-width="70" transform="translate(16 22)" filter="url(#app-soft)"/>
      <use href="#app-footprint" fill="none" stroke="#d9b876" stroke-opacity="0.55" stroke-width="16" transform="translate(-10 -13)" filter="url(#app-softer)"/>
    </g>
    <use href="#app-footprint" fill="none" stroke="url(#app-rim)" stroke-width="20" stroke-linejoin="round"/>
    <use href="#app-footprint" fill="none" stroke="#fff3d2" stroke-opacity="0.75" stroke-width="4" stroke-linejoin="round" transform="translate(-3 -4)"/>
  </g>
</svg>
